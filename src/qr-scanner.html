<!DOCTYPE html>

<html class="dark" lang="en"><head>
<script>
    (function() {
        var lang = localStorage.getItem('appLang') || 'tr';
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    })();
</script>
<meta name="view-transition" content="same-origin" />
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Oxygen - QR Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/src/style.css"/>
<style>
        .scan-line {
            animation: scan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes scan {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(240px); opacity: 0; }
        }
        .ripple {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(227, 30, 36, 0.7); }
            70% { transform: scale(1.1); opacity: 0; box-shadow: 0 0 0 30px rgba(227, 30, 36, 0); }
            100% { transform: scale(0.8); opacity: 0; box-shadow: 0 0 0 0 rgba(227, 30, 36, 0); }
        }
        .corner-tl { border-top-width: 4px; border-left-width: 4px; }
        .corner-tr { border-top-width: 4px; border-right-width: 4px; }
        .corner-bl { border-bottom-width: 4px; border-left-width: 4px; }
        .corner-br { border-bottom-width: 4px; border-right-width: 4px; }
    </style>
</head>
<body class="preload bg-background text-on-background h-screen w-full overflow-hidden relative">
<script>if(localStorage.getItem('sidebarState') === 'collapsed') document.body.classList.add('sidebar-collapsed');</script>
<script>window.addEventListener('load', () => { setTimeout(() => { document.body.classList.remove('preload'); }, 50); });</script>
<!-- Calm Static Background (Camera Overlay) -->

<script src="https://unpkg.com/html5-qrcode"></script>
<!-- Live Camera Background -->
<div class="absolute inset-0 bg-black z-0 overflow-hidden">
        <div id="reader" class="absolute inset-0 w-full h-full object-cover"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-black/80 via-transparent to-black/80 pointer-events-none"></div>
    </div>
<!-- Top Navigation (Task-Focused - Suppressed standard nav) -->
<div class="absolute top-0 start-0 w-full z-50 flex justify-between items-center px-container-margin py-stack-lg pt-12 bg-gradient-to-b from-black/60 to-transparent">
<a href="/index.html" class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-xl border border-primary/20 flex items-center justify-center text-on-surface hover:bg-primary/10 hover:border-primary/50 transition-all shadow-[0_0_15px_-3px_rgba(227,30,36,0.1)]">
        <span class="material-symbols-outlined" data-icon="close">close</span>
    </a>
<span class="font-headline-md text-headline-md font-bold text-white/50 tracking-widest uppercase text-sm">Oxygen</span>
<button id="toggle-torch-btn" class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-xl border border-primary/20 flex items-center justify-center text-on-surface hover:bg-primary/10 hover:border-primary/50 transition-all shadow-[0_0_15px_-3px_rgba(227,30,36,0.1)]">
<span class="material-symbols-outlined" data-icon="flash_on">flash_on</span>
</button>
</div>
<!-- Scanner Reticle Area -->
<div class="absolute inset-0 flex items-center justify-center z-10 pb-36 pointer-events-none">
<div class="relative w-64 h-64 ripple">
<!-- Reticle Corners -->
<div class="absolute top-0 start-0 w-8 h-8 border-primary corner-tl shadow-[0_0_20px_rgba(227,30,36,0.3)]"></div>
<div class="absolute top-0 end-0 w-8 h-8 border-primary corner-tr shadow-[0_0_20px_rgba(227,30,36,0.3)]"></div>
<div class="absolute bottom-0 start-0 w-8 h-8 border-primary corner-bl shadow-[0_0_20px_rgba(227,30,36,0.3)]"></div>
<div class="absolute bottom-0 end-0 w-8 h-8 border-primary corner-br shadow-[0_0_20px_rgba(227,30,36,0.3)]"></div>
<!-- Scan Line -->
<div class="absolute top-0 start-0 w-full h-[2px] bg-primary shadow-[0_0_15px_3px_rgba(227,30,36,0.6)] scan-line"></div>
<!-- Target Area Hint (Very subtle) -->
<div class="absolute inset-0 bg-primary/5 backdrop-blur-sm border border-primary/10 rounded-lg m-2"></div>
</div>
</div>
<!-- Bottom Instruction & Lookup Panel (Elevated above mobile bottom nav) -->
<div class="absolute bottom-[5.5rem] md:bottom-8 start-0 w-full px-container-margin z-40 flex justify-center pointer-events-auto">
<div class="bg-black/60 backdrop-blur-2xl border border-primary/30 rounded-2xl p-4 flex flex-col items-center shadow-[0_0_30px_-10px_rgba(227,30,36,0.4)] max-w-sm w-full">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-xl" data-icon="qr_code_scanner" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<p class="font-headline-sm text-sm text-on-surface font-bold" data-i18n="scanner.pointTitle">QR Kodu Okutun</p>
</div>
<p class="font-label-caps text-[11px] text-on-surface-variant text-center opacity-75 mb-3" data-i18n="scanner.pointDesc">Kamerayı cihaz üzerindeki QR koda hizalayın</p>
<div class="flex gap-2 w-full">
<input type="text" id="manual-hash" data-i18n="scanner.paste" placeholder="QR Hash kodunu buraya yapıştırın" class="flex-1 bg-surface-container/60 border border-primary/30 rounded-xl px-3 py-2 text-xs text-on-surface focus:border-primary focus:outline-none backdrop-blur-md text-center font-mono">
<button id="lookup-btn" class="bg-primary hover:bg-primary/90 text-black font-bold text-xs px-4 py-2 rounded-xl transition-all shadow-[0_0_15px_rgba(227,30,36,0.3)] shrink-0 flex items-center gap-1">
<span class="material-symbols-outlined text-sm">search</span>
<span data-i18n="scanner.lookup">Sorgula</span>
</button>
</div>
</div>
</div>
<!-- SideNavBar (Suppressed due to Task-Focused intent) -->
<!-- BottomNavBar (Suppressed due to Task-Focused intent) -->
<script type="module" src="/src/scannerLogic.ts"></script>
<script type="module" src="/src/nav.ts"></script>
    
</body></html>
