<style>
        .scan-line {
            animation: scan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes scan {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(240px); opacity: 0; }
        }
        .ripple {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(227, 30, 36, 0.7); }
            70% { transform: scale(1.1); opacity: 0; box-shadow: 0 0 0 30px rgba(227, 30, 36, 0); }
            100% { transform: scale(0.8); opacity: 0; box-shadow: 0 0 0 0 rgba(227, 30, 36, 0); }
        }
        .corner-tl { border-top-width: 4px; border-left-width: 4px; }
        .corner-tr { border-top-width: 4px; border-right-width: 4px; }
        .corner-bl { border-bottom-width: 4px; border-left-width: 4px; }
        .corner-br { border-bottom-width: 4px; border-right-width: 4px; }
