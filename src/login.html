<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<script>
    (function() {
        var lang = localStorage.getItem('appLang') || 'tr';
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    })();
</script>
<meta name="view-transition" content="same-origin" />
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Oxygen - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/src/style.css"/>
<style>
    .ambient-glow {
        position: fixed;
        top: -20vh;
        left: -20vw;
        width: 140vw;
        height: 140vh;
        background: radial-gradient(circle at 50% 50%, rgba(227, 30, 36, 0.15) 0%, rgba(0,0,0,0) 60%);
        z-index: -1;
        pointer-events: none;
    }
</style>
</head>
<body class="preload min-h-screen flex flex-col font-body-md bg-background text-on-background relative overflow-hidden items-center justify-center p-4">
    <!-- Floating Language Toggle -->
    <div class="fixed top-6 end-6 z-50">
        <button data-icon="language" class="flex items-center justify-center bg-black/40 border border-primary/20 hover:border-primary/50 text-primary rounded-full p-3 hover:bg-black/60 transition-all cursor-pointer shadow-[0_0_10px_rgba(255,180,171,0.2)]">
            <span class="material-symbols-outlined text-[20px]">language</span>
        </button>
    </div>

<script>if(localStorage.getItem('sidebarState') === 'collapsed') document.body.classList.add('sidebar-collapsed');</script>
<script>window.addEventListener('load', () => { setTimeout(() => { document.body.classList.remove('preload'); }, 50); });</script>
<!-- Calm Static Eye-friendly Background -->
<div class="fixed inset-0 w-full h-full -z-10 pointer-events-none" style="background: radial-gradient(circle at 50% 20%, rgba(227, 30, 36, 0.08) 0%, rgba(13, 14, 16, 0.95) 70%, #0d0e10 100%);"></div>

    <div class="ambient-glow"></div>
    
    <main class="w-full max-w-md">
        <!-- Logo Header -->
        <div class="flex flex-col items-center mb-8">
            <img alt="Oxygen Logo" class="w-20 h-20 rounded-full object-cover border border-primary/20 shadow-[0_0_20px_0_rgba(227,30,36,0.3)] mb-4" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBtAjPriLgY9QiNkDP-dtqRNilxfYRSlrKrN9NyedbnU2ai9oF2EEiI3LZ-34vLSb7PiD-ARqR2r1NMk5fGV6NO9CBhijRm_kFMBIOCapWXMK3u6pyoIalKhFuRsjhVj9dcmLUfCTK4dvLF3RlVqd2Cj7i2QE60Zz3wzdcbMkFlIMIF7Js30utm9PXzAhFgCvV75CuF-eYC9t9g1iyiYqjoXMIc-CAD6-E7BfE_1ZMrYinyaDB8C5KUWHPcxw7EeUSq0ZU"/>
            <h1 data-i18n="app.title" class="font-headline-lg text-headline-lg text-primary text-center">Oxygen</h1>
            <p data-i18n="app.subtitle" class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-[0.2em] mt-1 text-center whitespace-normal">Repair Management</p>
        </div>

        <!-- Login Form Container -->
        <section class="glass-panel rounded-2xl p-8 flex flex-col gap-6 relative overflow-hidden">
            <div class="absolute top-0 start-0 w-full h-1 bg-gradient-to-r from-primary/10 via-primary to-primary/10"></div>
            
            <form id="login-form" class="flex flex-col gap-6">
                <!-- Email -->
                <div class="flex flex-col gap-2">
                    <label data-i18n="login.email" class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Email Address</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute start-4 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
                        <input id="email" class="input-glass w-full rounded-xl py-4 ps-12 pe-4 text-on-background font-body-lg placeholder-on-surface-variant/50" placeholder="admin@oxygen.com" type="email" required />
                    </div>
                </div>

                <!-- Password -->
                <div class="flex flex-col gap-2">
                    <label data-i18n="login.password" class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute start-4 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">lock</span>
                        <input id="password" class="input-glass w-full rounded-xl py-4 ps-12 pe-4 text-on-background font-body-lg placeholder-on-surface-variant/50" placeholder="••••••••" type="password" required />
                    </div>
                </div>

                <div id="error-message" class="hidden font-body-md text-error text-center bg-error-container/20 border border-error/50 rounded-lg py-2 px-4"></div>

                <!-- Submit Action -->
                <button type="submit" id="submit-btn" class="btn-primary w-full py-4 rounded-xl font-headline-sm text-headline-sm mt-2 flex items-center justify-center gap-2 shadow-[0_4px_14px_0_rgba(227,30,36,0.39)] hover:shadow-[0_6px_20px_rgba(227,30,36,0.23)]">
                    <span data-i18n="login.signin">Sign In</span>
                    <span class="material-symbols-outlined flip-rtl" data-icon="arrow_forward" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
                </button>
            </form>
        </section>

        <!-- Mock Sign Up Helper -->
        <p data-i18n="login.testing" class="font-body-md text-on-surface-variant text-center mt-6">
            Testing credentials: Use `admin@oxygen.com` / `password123`.
        </p>
    </main>

    <script type="module" src="/src/nav.ts"></script>
    <script type="module" src="/src/loginLogic.ts"></script>
</body>
</html>
